services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '4000'
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Configure FRONTEND_ORIGIN}
      DATABASE_URL: mysql://undc:${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}@mysql:3306/undc_deportes
      STORAGE_DIR: /app/backend/storage
      SESSION_HOURS: '12'
      TZ: America/Lima
    expose:
      - '4000'
    volumes:
      - attachments:/app/backend/storage
    networks:
      - private
      - dokploy-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 30s
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: undc_deportes
      MYSQL_USER: undc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      TZ: America/Lima
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --connect-timeout=3 --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
volumes:
  mysql_data:
  attachments:
networks:
  private:
    internal: true
  dokploy-network:
    external: true
